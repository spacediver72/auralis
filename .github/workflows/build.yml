name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons and splash
        run: npx @capacitor/assets generate --android --assetPath assets
      - name: Configure background audio and media permissions
        run: |
          node -e "
            const fs = require('fs');
            const manifestPath = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(manifestPath, 'utf8');
            const perms = [
              '<uses-permission android:name=\"android.permission.WAKE_LOCK\" />',
              '<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />',
              '<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />'
            ].filter(p => !xml.includes(p)).join('\n    ');
            if (perms) {
              xml = xml.replace('<application', perms + '\n    <application');
              fs.writeFileSync(manifestPath, xml);
            }
          "
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: auralis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
